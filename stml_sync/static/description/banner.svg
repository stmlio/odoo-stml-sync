<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="STML Sync: batches of records written to Odoo in one call">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/><stop offset="0.6" stop-color="#262626"/><stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#mesh)"/>

  <!-- left: many single rows, each its own trip -->
  <g fill="#f2f2f2">
    <rect x="80" y="90" width="150" height="14" rx="7" opacity=".9"/>
    <rect x="80" y="122" width="120" height="14" rx="7" opacity=".75"/>
    <rect x="80" y="154" width="140" height="14" rx="7" opacity=".6"/>
    <rect x="80" y="186" width="100" height="14" rx="7" opacity=".5"/>
    <rect x="80" y="218" width="130" height="14" rx="7" opacity=".4"/>
    <rect x="80" y="250" width="110" height="14" rx="7" opacity=".3"/>
    <rect x="80" y="282" width="145" height="14" rx="7" opacity=".22"/>
  </g>
  <!-- bracket gathering them into one batch -->
  <path d="M262 84 h22 v218 h-22" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>

  <!-- one track to the right -->
  <path d="M300 193 H760" stroke="url(#track)" stroke-width="10" stroke-linecap="round"/>
  <path d="M740 170 L768 193 L740 216" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: the database with per-row savepoints -->
  <g transform="translate(830,110)">
    <ellipse cx="130" cy="20" rx="130" ry="20" fill="#f2f2f2" fill-opacity=".9"/>
    <path d="M0 20 V160 a130 20 0 0 0 260 0 V20" fill="#f2f2f2" fill-opacity=".18"/>
    <path d="M0 20 V160 a130 20 0 0 0 260 0 V20" fill="none" stroke="#f2f2f2" stroke-opacity=".7" stroke-width="3"/>
    <path d="M0 70 a130 20 0 0 0 260 0" fill="none" stroke="#f2f2f2" stroke-opacity=".45" stroke-width="3"/>
    <path d="M0 115 a130 20 0 0 0 260 0" fill="none" stroke="#f2f2f2" stroke-opacity=".45" stroke-width="3"/>
    <!-- one red row: rolled back alone -->
    <g>
      <circle cx="46" cy="96" r="8" fill="#fbbf24"/>
      <circle cx="90" cy="96" r="8" fill="#fbbf24"/>
      <circle cx="134" cy="96" r="8" fill="#f87171"/>
      <circle cx="178" cy="96" r="8" fill="#fbbf24"/>
      <circle cx="222" cy="96" r="8" fill="#fbbf24"/>
    </g>
  </g>

  <text x="80" y="350" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f2f2">STML Sync</text>
  <text x="248" y="350" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b8b8b8">up to 1,000 records per call, one savepoint per record</text>
</svg>
